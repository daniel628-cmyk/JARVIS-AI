name: Build NEXORA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SHERPA_VERSION: "1.12.40"
  KWS_MODEL: sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01

jobs:
  build:
    name: Build NEXORA AI APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify project files
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/nexora/ai/MainActivity.kt

      - name: Fetch sherpa-onnx AAR and keyword model
        run: |
          mkdir -p app/libs app/src/main/assets/kws work

          curl -fL --retry 3 -o "app/libs/sherpa-onnx-${SHERPA_VERSION}.aar" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"

          curl -fL --retry 3 -o work/model.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${KWS_MODEL}.tar.bz2"
          tar xf work/model.tar.bz2 -C work

          SRC="work/${KWS_MODEL}"
          cp "$SRC"/*int8*.onnx app/src/main/assets/kws/
          cp "$SRC/tokens.txt" app/src/main/assets/kws/
          cp "$SRC/bpe.model" app/src/main/assets/kws/

          for part in encoder decoder joiner; do
            ls app/src/main/assets/kws/${part}*int8*.onnx > /dev/null \
              || { echo "MISSING ${part} int8 model file"; exit 1; }
          done

          echo "---- app/libs"
          ls -lh app/libs
          echo "---- app/src/main/assets/kws"
          ls -lh app/src/main/assets/kws

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "---- model assets and native libs inside the APK"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "assets/kws|\.so$" || true
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/kws/tokens.txt"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/kws/bpe.model"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

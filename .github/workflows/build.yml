
name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Download project source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required SDK packages
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. Check project files
      - name: Verify project
        run: |
          echo "Checking JARVIS project..."
          ls -la
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/jarvis/ai/MainActivity.kt

      # 6. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 7. Build Android APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      # 8. Verify APK exists
      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      # 9. Upload APK
      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

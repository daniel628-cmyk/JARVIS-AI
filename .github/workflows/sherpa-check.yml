name: Check sherpa-onnx (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHERPA_VERSION: "1.12.40"
  KWS_MODEL: sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01

jobs:
  check:
    name: Verify sherpa-onnx AAR, model and keywords
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download sherpa-onnx AAR
        run: |
          mkdir -p work out
          curl -fL --retry 3 -o work/sherpa-onnx.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          ls -lh work/sherpa-onnx.aar

      - name: Inspect AAR native libraries
        run: |
          cd work
          unzip -l sherpa-onnx.aar | grep -E "\.so|classes\.jar|AndroidManifest" | tee ../out/aar-contents.txt

      - name: List Kotlin API with javap
        run: |
          cd work
          mkdir aar
          unzip -q sherpa-onnx.aar -d aar
          cd aar
          CLASSES=$(unzip -Z1 classes.jar | grep -E "Keyword|OnlineStream|FeatureConfig|OnlineModelConfig|OnlineTransducerModelConfig" | grep -v '\$' | sed 's/\.class$//' | tr '/' '.')
          echo "$CLASSES"
          javap -cp classes.jar -public $CLASSES | tee ../../out/kotlin-api.txt

      - name: Download keyword spotting model
        run: |
          cd work
          curl -fL --retry 3 -o model.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/${KWS_MODEL}.tar.bz2"
          tar xf model.tar.bz2
          ls -lh "${KWS_MODEL}"

      - name: Install sherpa-onnx Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sherpa-onnx==${SHERPA_VERSION}" sentencepiece click
          which sherpa-onnx-cli

      - name: Prepare keywords for Hello NEXORA
        run: |
          cd work
          printf 'HELLO NEXORA :1.5 #0.3\n' > keywords_raw.txt
          sherpa-onnx-cli text2token --tokens "${KWS_MODEL}/tokens.txt" --tokens-type bpe --bpe-model "${KWS_MODEL}/bpe.model" keywords_raw.txt keywords.txt
          echo "---- keywords.txt"
          cat keywords.txt
          cp keywords.txt ../out/keywords.txt

      - name: Check keyword tokens exist in tokens.txt
        run: |
          python - <<'PY' | tee out/token-check.txt
          import os
          model = os.environ["KWS_MODEL"]
          tokens = set()
          with open(f"work/{model}/tokens.txt", encoding="utf-8") as f:
              for line in f:
                  parts = line.rstrip("\n").split(" ")
                  if parts and parts[0]:
                      tokens.add(parts[0])
          bad = []
          with open("work/keywords.txt", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  print("KEYWORD LINE:", line)
                  for item in line.split():
                      if item[0] in ":#@":
                          break
                      if item not in tokens:
                          bad.append(item)
          print("MISSING TOKENS:", bad if bad else "none")
          if bad:
              raise SystemExit(1)
          PY

      - name: List model files we plan to use
        run: |
          ls -lh work/${KWS_MODEL}/*int8* work/${KWS_MODEL}/tokens.txt work/${KWS_MODEL}/bpe.model | tee out/model-files.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-check-output
          path: out/
